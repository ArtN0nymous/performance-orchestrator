worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /var/log/nginx/access.log;
  default_type application/json;

  upstream app {
    server target-app:5000;
  }

  # Public traffic: 503 when /var/run/maintenance exists (bind-mounted from target-app).
  server {
    listen 80;
    location / {
      if (-f /shared/maintenance/flag) {
        return 503 '{"error":"maintenance"}';
      }
      proxy_pass http://app;
    }
  }

  # Test traffic: always live. k6 must use this port during maintenance.
  server {
    listen 8088;
    location / {
      proxy_set_header X-Perf-Test-Traffic lab;
      proxy_pass http://app;
    }
  }
}
