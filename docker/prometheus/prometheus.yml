global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: docker-stats
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 9s
    static_configs:
      - targets: ["docker-stats-exporter:9101"]
  - job_name: fixture
    metrics_path: /metrics
    static_configs:
      - targets: ["target-app:5000"]
