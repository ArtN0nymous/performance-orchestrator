[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-orchestrator"
version = "1.0.0"
description = "Reusable k6 performance-test orchestrator with SSH target lifecycle, scheduler, and reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "performance-orchestrator contributors" }]
dependencies = [
  "click>=8.1.7,<9",
  "pydantic>=2.9.2,<3",
  "PyYAML>=6.0.2,<7",
  "croniter>=5.0.1,<6",
  "httpx>=0.27.2,<1",
  "Jinja2>=3.1.4,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3,<9",
  "pytest-cov>=5.0.0,<6",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator = ["reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires docker/network services",
  "e2e: full lab stack",
]

[tool.coverage.run]
source = ["src/orchestrator"]
